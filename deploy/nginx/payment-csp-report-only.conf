# Payment-page CSP (Report-Only) — route-scoped via $request_uri.
#
# IMPORTANT: Do NOT include this inside a `location ~ ^/bills/.*/pay` block,
# because Laravel routes internally redirect to /index.php via try_files,
# which causes Nginx to re-evaluate the location to `\.php$` and drop any
# `add_header` defined only on the payment location.
#
# Instead:
#   1. Include `payment-csp-map.conf` inside `http {}` (nginx.conf or conf.d/).
#   2. Apply the map variables as `add_header` at the `server {}` scope.
#      Empty map values cause Nginx to skip emitting the header (>= 1.7.5),
#      so non-payment URLs are NOT affected.
#
# Example server-block usage:
#
#   server {
#       listen 80;
#       server_name dashboard-bills.example.sa;
#       # ... other headers (HSTS, X-Frame-Options, etc.) ...
#       include /etc/nginx/snippets/payment-csp-report-only.conf;
#       # ... locations ...
#   }

add_header Content-Security-Policy-Report-Only $payment_csp_report_only always;
add_header Referrer-Policy                     $payment_referrer_policy    always;
add_header Permissions-Policy                  $payment_permissions_policy always;
add_header X-Content-Type-Options              "nosniff"                   always;
