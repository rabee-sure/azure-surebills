# Payment-page CSP — route-scoped policy built with `map` on $request_uri.
#
# WHY: Laravel's payment route uses `try_files ... /index.php?$query_string;`
# which triggers an internal redirect to the PHP location (`\.php$`). Nginx
# applies response headers from the FINAL location that produced the response,
# so any CSP defined only on the payment regex location is dropped before the
# response reaches the client.
#
# `$request_uri` preserves the ORIGINAL request URI even after internal
# rewrites, which lets us toggle payment headers at the `server {}` level
# without leaking the policy onto non-payment URLs.
#
# Empty `map` values cause Nginx (>= 1.7.5) to skip emitting the header,
# so non-payment URLs are not affected.
#
# INSTALL: include this file at the `http {}` scope, e.g. in nginx.conf:
#
#   http {
#       include /etc/nginx/conf.d/payment-csp-map.conf;
#       ...
#   }
#
# Then include one of the per-mode snippets inside the `server {}` that serves
# the payment routes:
#   - deploy/nginx/payment-csp-report-only.conf   (stage 1: observe)
#   - deploy/nginx/payment-csp-enforce.conf       (stage 2: enforce)

# ---------------------------------------------------------------------------
# Route match for payment pages. Adjust regex if your route pattern changes.
# Matches: /bills/{id}/pay, /bills/{id}/pay/, /bills/{id}/pay?..., /bills/{id}/pay/{lang}
# ---------------------------------------------------------------------------

# Content-Security-Policy-Report-Only (stage 1 — observe & tune)
map $request_uri $payment_csp_report_only {
    default                                "";
    "~*^/bills/[^/]+/pay(/|\?|$)"          "default-src 'self'; script-src 'self' https://code.jquery.com https://www.googletagmanager.com https://*.mastercard.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.mastercard.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; report-uri /api/csp/report";
}

# Content-Security-Policy (stage 2 — enforce)
map $request_uri $payment_csp_enforce {
    default                                "";
    "~*^/bills/[^/]+/pay(/|\?|$)"          "default-src 'self'; script-src 'self' https://code.jquery.com https://www.googletagmanager.com https://*.mastercard.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.mastercard.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; report-uri /api/csp/report";
}

# Referrer-Policy (applied on payment pages only)
map $request_uri $payment_referrer_policy {
    default                         "";
    "~*^/bills/[^/]+/pay(/|\?|$)"   "strict-origin-when-cross-origin";
}

# Permissions-Policy (applied on payment pages only)
map $request_uri $payment_permissions_policy {
    default                         "";
    "~*^/bills/[^/]+/pay(/|\?|$)"   "camera=(), microphone=(), geolocation=()";
}
