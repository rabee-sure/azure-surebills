# Payment-page CSP — route-scoped policy built with `map` on $request_uri.
#
# WHY: Laravel's payment route uses `try_files ... /index.php?$query_string;`
# which triggers an internal redirect to the PHP location (`\.php$`). Nginx
# applies response headers from the FINAL location that produced the response,
# so any CSP defined only on the payment regex location is dropped before the
# response reaches the client.
#
# `$request_uri` preserves the ORIGINAL request URI even after internal
# rewrites, which lets us toggle payment headers at the `server {}` level
# without leaking the policy onto non-payment URLs.
#
# Empty `map` values cause Nginx (>= 1.7.5) to skip emitting the header,
# so non-payment URLs are not affected.
#
# INSTALL: include this file at the `http {}` scope, e.g. in nginx.conf:
#
#   http {
#       include /etc/nginx/conf.d/payment-csp-map.conf;
#       ...
#   }
#
# Then include one of the per-mode snippets inside the `server {}` that serves
# the payment routes:
#   - deploy/nginx/payment-csp-report-only.conf   (stage 1: observe)
#   - deploy/nginx/payment-csp-enforce.conf       (stage 2: enforce)

# ---------------------------------------------------------------------------
# Route match for payment pages. Adjust regex if your route pattern changes.
# Matches: /bills/{id}/pay, /bills/{id}/pay/, /bills/{id}/pay?..., /bills/{id}/pay/{lang}
# ---------------------------------------------------------------------------

# NOTE — PCI 11.6 temporary exception:
#   'unsafe-eval' is currently permitted in script-src because the Vue 2 full
#   build (bundled in public/js/app.js) compiles the #app DOM template at
#   runtime via new Function(). The long-term fix is to remove the runtime
#   template dependency (drop id="app" from payment Blades, or migrate to
#   Vue runtime-only). Once that is shipped, DELETE 'unsafe-eval' from both
#   map entries below and re-test with report-only before enforcing.

# NOTE — OCI Object Storage in img-src:
#   Merchant-uploaded logos and bill-page background images are stored in
#   Oracle Cloud Infrastructure (OCI) Object Storage and are rendered on the
#   payment page via short-lived pre-signed URLs whose host looks like
#   `<namespace>.compat.objectstorage.<region>.oraclecloud.com`. CSP source
#   expressions only support a single leading-label wildcard (no nested `*.`),
#   so we whitelist `https://*.oraclecloud.com` to remain region/namespace
#   agnostic across environments (staging, production, future regions).
#
# NOTE — Dashboard host in form-action:
#   The customer-facing payment page is served from the INVOICE_SUBDOMAIN
#   (e.g. `payment.surebills.dev` locally, `pay-bills.surepay.sa` in prod)
#   via RedirectToSubDomainMiddleware, but the Mastercard 3DS TermUrl
#   (`mastercard.3ds` route under routes/api.php) is generated against the
#   main app/dashboard host because that route group is not bound to the
#   invoice subdomain. After frictionless 3DS, MPGS returns a form whose
#   action is that cross-origin TermUrl; the auto-submit then trips
#   `form-action 'self'`. We therefore explicitly allow every environment's
#   dashboard host. CSP source expressions only allow a single leading-label
#   wildcard (no nested `*.`), so each host is listed verbatim.
#
#   Environment registry (keep in sync with `.env`'s APP_URL across envs):
#     - local       https://surebills.dev
#     - staging     https://dashboard-bills.surepay.sa
#     - sandbox     https://sandbox-bills.surepay.sa
#     - production  https://bills.surepay.sa
#     - production  https://pay-bills.surepay.sa   (alternate prod hostname)
#
#   When a new environment is added, append its dashboard host below in BOTH
#   the report-only and enforce maps.

# Content-Security-Policy-Report-Only (stage 1 — observe & tune)
map $request_uri $payment_csp_report_only {
    default                                "";
    "~*^/bills/[^/]+/pay(/|\?|$)"          "default-src 'self'; script-src 'self' https://code.jquery.com https://www.googletagmanager.com https://*.mastercard.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.oraclecloud.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.mastercard.com wss://ws-eu.pusher.com https://sockjs-eu.pusher.com; frame-src https://*.mastercard.com https://*.gateway.mastercard.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.mastercard.com https://*.gateway.mastercard.com https://surebills.dev https://dashboard-bills.surepay.sa https://sandbox-bills.surepay.sa https://bills.surepay.sa https://pay-bills.surepay.sa; upgrade-insecure-requests; report-uri /api/csp/report";
}

# Content-Security-Policy (stage 2 — enforce)
map $request_uri $payment_csp_enforce {
    default                                "";
    "~*^/bills/[^/]+/pay(/|\?|$)"          "default-src 'self'; script-src 'self' https://code.jquery.com https://www.googletagmanager.com https://*.mastercard.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.oraclecloud.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.mastercard.com wss://ws-eu.pusher.com https://sockjs-eu.pusher.com; frame-src https://*.mastercard.com https://*.gateway.mastercard.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.mastercard.com https://*.gateway.mastercard.com https://surebills.dev https://dashboard-bills.surepay.sa https://sandbox-bills.surepay.sa https://bills.surepay.sa https://pay-bills.surepay.sa; upgrade-insecure-requests; report-uri /api/csp/report";
}

# Referrer-Policy (applied on payment pages only)
map $request_uri $payment_referrer_policy {
    default                         "";
    "~*^/bills/[^/]+/pay(/|\?|$)"   "strict-origin-when-cross-origin";
}

# Permissions-Policy (applied on payment pages only)
map $request_uri $payment_permissions_policy {
    default                         "";
    "~*^/bills/[^/]+/pay(/|\?|$)"   "camera=(), microphone=(), geolocation=()";
}
