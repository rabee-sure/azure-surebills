# Payment-page CSP (Enforce) — route-scoped via $request_uri.
#
# Use after report-only tuning is complete and the payment-flow regression
# passes with zero blocking violations.
#
# See `payment-csp-report-only.conf` for the full rationale on why we scope
# the policy via the `$payment_csp_*` map variables at the `server {}` scope
# rather than via a `location ~ ^/bills/.*/pay` block.
#
# Prerequisite:
#   Include `payment-csp-map.conf` inside `http {}` AND ensure the enforce
#   map variant (`$payment_csp_enforce`) is defined there.
#
# Example server-block usage:
#
#   server {
#       listen 443 ssl http2;
#       server_name dashboard-bills.example.sa;
#       # ... other headers (HSTS, X-Frame-Options, etc.) ...
#       include /etc/nginx/snippets/payment-csp-enforce.conf;
#       # ... locations ...
#   }

add_header Content-Security-Policy $payment_csp_enforce        always;
add_header Referrer-Policy         $payment_referrer_policy    always;
add_header Permissions-Policy      $payment_permissions_policy always;
add_header X-Content-Type-Options  "nosniff"                   always;
