name: Payment Page Integrity Check

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - master

jobs:
  payment-page-integrity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Ensure scripts are executable
        run: chmod +x scripts/generate-payment-page-manifest.sh scripts/verify-payment-page-manifest.sh scripts/check-payment-asset-change-policy.sh

      - name: Validate payment page manifest integrity
        run: scripts/verify-payment-page-manifest.sh

      - name: Enforce manifest update policy on PR
        if: github.event_name == 'pull_request'
        run: scripts/check-payment-asset-change-policy.sh origin/${{ github.base_ref }} HEAD
